# Render 蓝图：一键部署「先见」（免费版，国内可访问）
# 用法：Render → New → Blueprint → 选本仓库 → Apply
#
# 数据不落在 Render 上（免费实例没有持久磁盘），而是写进 Cloudflare D1：
#   server.mjs 读到 CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID + D1_DATABASE_ID 时自动切到 D1。
# 三个密钥都不进仓库，在 Render 面板里填（sync: false）。

services:
  - type: web
    name: xianjian
    runtime: node
    plan: free
    region: singapore
    buildCommand: echo "no build step"
    startCommand: node 大报告/服务/server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: CLOUDFLARE_ACCOUNT_ID
        value: e6d94c5250ffc660b64e1bbffbaf72b0
      - key: D1_DATABASE_ID
        value: 4779567b-113a-4219-b3a1-f2d10185859f
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: ADMIN_TOKEN
        sync: false
