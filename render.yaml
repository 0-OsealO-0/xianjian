# Render 蓝图：一键部署「先见」
# 用法：Render → New → Blueprint → 选本仓库 → Apply
# 注意：持久盘（disk）需要 Starter 及以上套餐；免费实例的文件系统是临时的，
#       重启/重新部署会丢 SQLite 数据（反馈）。要用免费版，请改成「本机 + 隧道」方案（见 部署.md）。

services:
  - type: web
    name: xianjian
    runtime: node
    plan: starter
    region: singapore
    buildCommand: echo "no build step"
    startCommand: node 大报告/服务/server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: ADMIN_TOKEN
        sync: false          # 部署时在面板里填一个自己想的字符串
    disk:
      name: xianjian-data
      mountPath: /opt/render/project/src/大报告/服务/data
      sizeGB: 1
